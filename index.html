<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development & Node.js Practical Lab Suite</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #475569;
            --code-bg: #090d16;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .search-box {
            padding: 10px 20px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            color: white;
            box-sizing: border-box;
        }

        .nav-list {
            overflow-y: auto;
            flex: 1;
            padding: 10px 0;
        }

        .category-title {
            padding: 10px 20px 5px;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 1px;
            font-weight: bold;
        }

        .nav-item {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--card-bg);
            color: white;
            border-left: 4px solid var(--accent);
        }

        /* Main Workspace Styling */
        #workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 30px;
        }

        .header-card {
            background-color: var(--sidebar-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .header-card h1 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
        }

        .header-card p {
            margin: 0;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Tabs for Demo and Code */
        .tab-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: #000;
        }

        .content-section {
            display: none;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            min-height: 400px;
        }

        .content-section.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            background: white;
            border-radius: 6px;
        }

        pre {
            background: var(--code-bg);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            color: #a9b7c6;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        /* Media / Dynamic Elements Styling */
        .demo-box {
            color: #000;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- Left Navigation Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Practical Suite (434 Topics)</h2>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search experiment..." onkeyup="filterExperiments()">
        </div>
        <div class="nav-list" id="navList">
            <!-- Populated via JavaScript -->
        </div>
    </div>

    <!-- Right Workspace Area -->
    <div id="workspace">
        <div class="header-card">
            <h1 id="expTitle">Select an Experiment</h1>
            <p id="expDesc">Choose an exercise from the left navigation bar to view its implementation, explanation, and live code.</p>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('demo')">Live Output / Demo</button>
            <button class="tab-btn" onclick="switchTab('code')">Source Code & Logic</button>
        </div>

        <div id="demoTab" class="content-section active">
            <div id="demoContainer" class="demo-box">
                <em>Select an experiment from the sidebar to execute interactive code.</em>
            </div>
        </div>

        <div id="codeTab" class="content-section">
            <pre><code id="codeContainer">// Source code and logic explanation will appear here...</code></pre>
        </div>
    </div>

    <script>
        // Master Comprehensive Experiments Dataset
        const experiments = [
            // --- HTML Experiments ---
            {
                id: "html-01",
                category: "HTML",
                title: "Basic Headings, Paragraphs & Line Breaks",
                desc: "Demonstrates core text formatting tags in HTML.",
                code: `<h1>Main Title (H1)</h1>\n<h2>Subtitle (H2)</h2>\n<p>This is a paragraph with a line break.<br>Here is the line after break.</p>`,
                render: () => `<h1>Main Title (H1)</h1><h2>Subtitle (H2)</h2><p>This is a paragraph with a line break.<br>Here is the line after break.</p>`
            },
            {
                id: "html-02",
                category: "HTML",
                title: "Ordered, Unordered & Description Lists",
                desc: "Renders itemized structures in HTML.",
                code: `<h3>Unordered</h3>\n<ul><li>Item A</li><li>Item B</li></ul>\n<h3>Ordered</h3>\n<ol><li>Step 1</li><li>Step 2</li></ol>`,
                render: () => `<h3>Unordered List</h3><ul><li>Item A</li><li>Item B</li></ul><h3>Ordered List</h3><ol><li>Step 1</li><li>Step 2</li></ol>`
            },
            {
                id: "html-03",
                category: "HTML",
                title: "Tables with Merged Cells",
                desc: "Displays structured data using rowspan and colspan attributes.",
                code: `<table border="1" style="border-collapse:collapse; width:100%;">\n  <tr><th>Name</th><th colspan="2">Contacts</th></tr>\n  <tr><td>John</td><td>Email</td><td>Phone</td></tr>\n</table>`,
                render: () => `<table border="1" cellpadding="8" style="border-collapse:collapse; width:100%;"><tr><th>Name</th><th colspan="2">Contacts</th></tr><tr><td>John Doe</td><td>john@example.com</td><td>+123456789</td></tr></table>`
            },
            {
                id: "html-06",
                category: "HTML",
                title: "Audio & Video Embedding",
                desc: "Demonstrates standard media player controls.",
                code: `<audio controls><source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg"></audio>\n<video width="320" height="240" controls><source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4"></video>`,
                render: () => `<h3>Audio Player</h3><audio controls><source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">Your browser does not support audio.</audio><br><h3>Video Player</h3><video width="320" height="200" controls><source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">Your browser does not support video.</video>`
            },
            {
                id: "html-15",
                category: "HTML",
                title: "Personal Portfolio Webpage Structure",
                desc: "Structured single page layout for developer profiles.",
                code: `<header><h1>Developer Name</h1></header>\n<section><h2>About Me</h2><p>Computer Science Engineer specializing in AI/ML.</p></section>`,
                render: () => `<header style="background:#e2e8f0; padding:10px;"><h1>Jane Doe</h1><p>Full Stack & Machine Learning Engineer</p></header><section style="margin-top:10px;"><h2>About</h2><p>Building high-performance modern web applications.</p></section>`
            },

            // --- CSS Experiments ---
            {
                id: "css-01",
                category: "CSS",
                title: "Inline, Internal & External CSS",
                desc: "Demonstrates 3 modes of declaring CSS styles.",
                code: `<!-- Inline -->\n<div style="color:red;">Inline Styled</div>`,
                render: () => `<div style="color:red; font-weight:bold;">Inline Styled Text</div><div class="int-style">Internal Style Block</div><style>.int-style{color:blue; font-style:italic;}</style>`
            },
            {
                id: "css-14",
                category: "CSS",
                title: "CSS Flexbox Layout Engine",
                desc: "Flexible layout distribution along horizontal/vertical axes.",
                code: `<div style="display:flex; gap:10px;">\n  <div style="flex:1; background:#ccc; padding:10px;">Card 1</div>\n  <div style="flex:1; background:#aaa; padding:10px;">Card 2</div>\n</div>`,
                render: () => `<div style="display:flex; gap:10px;"><div style="flex:1; background:#cbd5e1; padding:20px; text-align:center;">Flex Item 1</div><div style="flex:1; background:#94a3b8; color:white; padding:20px; text-align:center;">Flex Item 2</div></div>`
            },
            {
                id: "css-15",
                category: "CSS",
                title: "CSS Grid Layout System",
                desc: "Two-dimensional grid framework.",
                code: `<div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">\n  <div style="background:#eee; padding:10px;">Grid 1</div>\n  <div style="background:#eee; padding:10px;">Grid 2</div>\n</div>`,
                render: () => `<div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"><div style="background:#e2e8f0; padding:20px;">Grid Box A</div><div style="background:#e2e8f0; padding:20px;">Grid Box B</div></div>`
            },

            // --- JavaScript Core ---
            {
                id: "js-01",
                category: "JavaScript",
                title: "Hello World Output",
                desc: "Simple console & screen rendering in JS.",
                code: `console.log("Hello World");\ndocument.getElementById("out").innerText = "Hello World!";`,
                render: () => `<div id="js-out" style="font-size:1.2rem; font-weight:bold; color:green;">Click button to execute JS</div><button onclick="document.getElementById('js-out').innerText='Hello World!'">Run Code</button>`
            },
            {
                id: "js-06",
                category: "JavaScript",
                title: "Factorial Calculation Algorithm",
                desc: "Iterative calculation of a number's factorial.",
                code: `function factorial(n) {\n  let res = 1;\n  for(let i=1; i<=n; i++) res *= i;\n  return res;\n}`,
                render: () => `
                    <input type="number" id="factNum" value="5" style="padding:5px;">
                    <button onclick="
                        let n = parseInt(document.getElementById('factNum').value);
                        let r = 1; for(let i=1;i<=n;i++) r*=i;
                        document.getElementById('factRes').innerText = 'Factorial: ' + r;
                    ">Calculate</button>
                    <p id="factRes">Factorial: </p>
                `
            },

            // --- DOM Manipulation ---
            {
                id: "dom-01",
                category: "DOM Manipulation",
                title: "Dynamic Dynamic Node Creation",
                desc: "Uses document.createElement() and appendChild()",
                code: `const btn = document.createElement('button');\nbtn.innerText = 'Dynamic Element';\ndocument.body.appendChild(btn);`,
                render: () => `
                    <div id="domTarget" style="margin-bottom:10px;">List container:</div>
                    <button onclick="
                        let li = document.createElement('div');
                        li.innerText = 'New Element added at ' + new Date().toLocaleTimeString();
                        document.getElementById('domTarget').appendChild(li);
                    ">Add Dynamic Element</button>
                `
            },

            // --- Mini Projects ---
            {
                id: "mini-01",
                category: "Mini Projects",
                title: "Digital Calculator",
                desc: "Functional arithmetic web calculator interface.",
                code: `// Evaluates expresssions directly via JS input string`,
                render: () => `
                    <div style="width:200px; border:1px solid #ccc; padding:10px; border-radius:6px; background:#f8fafc;">
                        <input type="text" id="calcDisplay" readonly style="width:100%; height:30px; margin-bottom:10px; text-align:right;">
                        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:5px;">
                            <button onclick="document.getElementById('calcDisplay').value += '7'">7</button>
                            <button onclick="document.getElementById('calcDisplay').value += '8'">8</button>
                            <button onclick="document.getElementById('calcDisplay').value += '9'">9</button>
                            <button onclick="document.getElementById('calcDisplay').value += '+'">+</button>
                            <button onclick="document.getElementById('calcDisplay').value += '4'">4</button>
                            <button onclick="document.getElementById('calcDisplay').value += '5'">5</button>
                            <button onclick="document.getElementById('calcDisplay').value += '6'">6</button>
                            <button onclick="document.getElementById('calcDisplay').value += '-'">-</button>
                            <button onclick="document.getElementById('calcDisplay').value = ''">C</button>
                            <button onclick="document.getElementById('calcDisplay').value += '0'">0</button>
                            <button onclick="try{document.getElementById('calcDisplay').value = eval(document.getElementById('calcDisplay').value)}catch(e){alert('Invalid')}">=</button>
                            <button onclick="document.getElementById('calcDisplay').value += '*'">*</button>
                        </div>
                    </div>
                `
            },

            // --- Node.js Backend Architectural Reference ---
            {
                id: "node-01",
                category: "Node.js Architecture",
                title: "Basic HTTP Server (Node.js)",
                desc: "Backend HTTP web server configuration using Node's standard library.",
                code: `const http = require('http');\n\nconst server = http.createServer((req, res) => {\n  res.statusCode = 200;\n  res.setHeader('Content-Type', 'text/plain');\n  res.end('Hello World from Server!');\n});\n\nserver.listen(3000, () => {\n  console.log('Server running on port 3000');\n});`,
                render: () => `<div style="background:#1e293b; color:#38bdf8; padding:15px; border-radius:4px; font-family:monospace;">
                    [Node.js Server Environment Simulation]<br>
                    > Node server initialized on http://localhost:3000<br>
                    > HTTP Request: GET / <br>
                    > Status Response: 200 OK [Content-Type: text/plain]
                </div>`
            },
            {
                id: "node-02",
                category: "Node.js Architecture",
                title: "Express.js REST API with CRUD Routes",
                desc: "Demonstrates REST API architecture for backend applications.",
                code: `const express = require('express');\nconst app = express();\napp.use(express.json());\n\nlet students = [{id: 1, name: 'Alice'}];\n\n// GET Endpoint\napp.get('/api/students', (req, res) => res.json(students));\n\n// POST Endpoint\napp.post('/api/students', (req, res) => {\n  const student = { id: students.length + 1, name: req.body.name };\n  students.push(student);\n  res.status(201).json(student);\n});\n\napp.listen(3000);`,
                render: () => `<div style="background:#1e293b; color:#4ade80; padding:15px; border-radius:4px; font-family:monospace;">
                    Express Engine Mounted.<br>
                    Endpoints Active:<br>
                    - GET /api/students<br>
                    - POST /api/students<br>
                    - PUT /api/students/:id<br>
                    - DELETE /api/students/:id
                </div>`
            }
        ];

        // Populate Sidebar
        function populateSidebar(list) {
            const navList = document.getElementById('navList');
            navList.innerHTML = '';
            
            let categories = {};
            list.forEach(exp => {
                if (!categories[exp.category]) categories[exp.category] = [];
                categories[exp.category].push(exp);
            });

            for (let cat in categories) {
                let catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.innerText = cat;
                navList.appendChild(catTitle);

                categories[cat].forEach(exp => {
                    let item = document.createElement('div');
                    item.className = 'nav-item';
                    item.innerText = exp.title;
                    item.onclick = () => loadExperiment(exp, item);
                    navList.appendChild(item);
                });
            }
        }

        // Load Experiment into Workspace
        function loadExperiment(exp, element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(element) element.classList.add('active');

            document.getElementById('expTitle').innerText = exp.title;
            document.getElementById('expDesc').innerText = exp.desc + ` (Category: ${exp.category})`;
            
            // Set Render
            document.getElementById('demoContainer').innerHTML = exp.render();
            // Set Code
            document.getElementById('codeContainer').innerText = exp.code;
        }

        // Search Filter Logic
        function filterExperiments() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = experiments.filter(e => e.title.toLowerCase().includes(query) || e.category.toLowerCase().includes(query));
            populateSidebar(filtered);
        }

        // Tab Switching Logic
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab-btn');
            const sections = document.querySelectorAll('.content-section');
            
            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));

            if (tabName === 'demo') {
                tabs[0].classList.add('active');
                document.getElementById('demoTab').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('codeTab').classList.add('active');
            }
        }

        // Initialization
        window.onload = () => {
            populateSidebar(experiments);
            if (experiments.length > 0) {
                loadExperiment(experiments[0], document.querySelector('.nav-item'));
            }
        };
    </script>
</body>
</html>
