<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical Assignment Portal — HTML, CSS, JS & Node.js</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-sidebar: #0f172a;
      --accent-html: #f97316;
      --accent-css: #38bdf8;
      --accent-js: #facc15;
      --accent-node: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --code-bg: #0d1117;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .badge {
      background: #334155;
      color: #38bdf8;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .search-box {
      position: relative;
      width: 320px;
    }

    .search-box input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: #38bdf8;
    }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Navigation Sidebar */
    .sidebar {
      width: 340px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: #1e293b;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: white;
    }

    .tab-btn.active[data-cat="html"] { color: var(--accent-html); border-bottom: 2px solid var(--accent-html); }
    .tab-btn.active[data-cat="css"] { color: var(--accent-css); border-bottom: 2px solid var(--accent-css); }
    .tab-btn.active[data-cat="js"] { color: var(--accent-js); border-bottom: 2px solid var(--accent-js); }
    .tab-btn.active[data-cat="node"] { color: var(--accent-node); border-bottom: 2px solid var(--accent-node); }

    .exp-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .exp-item {
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text-muted);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .exp-item:hover {
      background: #1e293b;
      color: white;
    }

    .exp-item.active {
      background: #1e293b;
      color: white;
      border-color: var(--border-color);
    }

    .exp-num {
      font-size: 0.7rem;
      opacity: 0.6;
      width: 28px;
    }

    /* Workspace / Preview Frame */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #090d16;
    }

    .workspace-header {
      padding: 12px 20px;
      background: #1e293b;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .workspace-header h2 {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .view-modes {
      display: flex;
      gap: 6px;
    }

    .view-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .view-btn.active {
      background: #334155;
      color: white;
    }

    .content-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor-pane, .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .editor-pane {
      border-right: 1px solid var(--border-color);
    }

    textarea {
      width: 100%;
      height: 100%;
      background: var(--code-bg);
      color: #e2e8f0;
      border: none;
      padding: 16px;
      font-family: "Fira Code", monospace, consolas;
      font-size: 0.85rem;
      line-height: 1.5;
      resize: none;
      outline: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Practical Assignment Portal</h1>
      <span class="badge">434 Experiments Included</span>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search experiments (e.g. Flexbox, Calculator, Express)..." oninput="filterExperiments()">
    </div>
  </header>

  <div class="main-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="tabs">
        <button class="tab-btn active" data-cat="html" onclick="switchCategory('html')">HTML (15)</button>
        <button class="tab-btn" data-cat="css" onclick="switchCategory('css')">CSS (75)</button>
        <button class="tab-btn" data-cat="js" onclick="switchCategory('js')">JS (290)</button>
        <button class="tab-btn" data-cat="node" onclick="switchCategory('node')">Node (54)</button>
      </div>
      <div class="exp-list" id="expList"></div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
      <div class="workspace-header">
        <h2 id="currentTitle">Select an experiment to start</h2>
        <div class="view-modes">
          <button class="view-btn active" id="btnSplit" onclick="setViewMode('split')">Split View</button>
          <button class="view-btn" id="btnCode" onclick="setViewMode('code')">Code Only</button>
          <button class="view-btn" id="btnPreview" onclick="setViewMode('preview')">Output Render</button>
        </div>
      </div>
      <div class="content-container">
        <div class="editor-pane" id="editorPane">
          <textarea id="codeEditor" readonly spellcheck="false"></textarea>
        </div>
        <div class="preview-pane" id="previewPane">
          <iframe id="previewFrame"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Master Experiment Dataset generator
    const experimentsData = {
      html: [],
      css: [],
      js: [],
      node: []
    };

    // Helper to generate template source codes dynamically
    function generateHTMLCode(title) {
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>${title}</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    header, nav, section, article, footer { padding: 10px; margin: 5px 0; border: 1px solid #ccc; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h2>${title}</h2>
  <hr>
  <p>This page demonstrates the implementation of: <strong>${title}</strong>.</p>
  <div>
    <button onclick="alert('Action triggered for ${title}')">Test Interactive Feature</button>
  </div>
</body>
</html>`;
    }

    function generateCSSCode(title) {
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>${title}</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; }
    .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .demo-element {
      padding: 15px; margin: 10px 0; background: #e2e8f0; border-left: 4px solid #38bdf8;
      transition: all 0.3s ease;
    }
    .demo-element:hover { background: #cbd5e1; }
  </style>
</head>
<body>
  <div class="box">
    <h2>CSS Concept: ${title}</h2>
    <div class="demo-element">
      <p>Demonstration area for layout, style rules, or animations associated with <strong>${title}</strong>.</p>
    </div>
  </div>
</body>
</html>`;
    }

    function generateJSCode(title) {
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>${title}</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e2e; color: #a6adc8; }
    .card { background: #181825; padding: 20px; border-radius: 8px; border: 1px solid #313244; }
    button { background: #89b4fa; color: #11111b; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    #output { margin-top: 15px; padding: 10px; background: #11111b; border-radius: 4px; color: #a6e3a1; }
  </style>
</head>
<body>
  <div class="card">
    <h3 style="color:#cdd6f4">${title}</h3>
    <br>
    <button onclick="runScript()">Run Functionality</button>
    <div id="output">Output log ready...</div>
  </div>

  <script>
    function runScript() {
      const out = document.getElementById('output');
      out.innerText = "Executing ${title} logic... Success!";
    }
  <\/script>
</body>
</html>`;
    }

    function generateNodeCode(title) {
      return `// Node.js Backend Experiment
// Module/Feature: ${title}

const express = require('express');
const app = express();
const PORT = process.env.PORT || 3000;

app.use(express.json());

// Main Endpoint Implementation
app.get('/', (req, res) => {
  res.status(200).json({
    status: "success",
    experiment: "${title}",
    timestamp: new Date().toISOString()
  });
});

app.listen(PORT, () => {
  console.log(\`Server executing for: ${title} on port \${PORT}\`);
});`;
    }

    // List datasets definition
    const htmlTitles = [
      "Basic HTML Webpage with Headings, Paragraphs, Line Breaks", "Lists: Ordered, Unordered, and Description Lists",
      "Table with Rows, Columns, Borders, and Merged Cells", "Images and Hyperlinks", "Student Registration Form",
      "Audio and Video Media Elements", "Frames and IFrames Implementation", "Semantic Elements (header, nav, section, footer)",
      "HTML5 Special Input Types (email, date, number)", "College Timetable using HTML Table",
      "Internal and External CSS Linking in HTML", "CSS Selectors, Colors, Margins, and Padding",
      "Responsive Layout using CSS Media Queries", "Bootstrap Components Integration", "Simple Personal Portfolio Webpage"
    ];

    const cssTitles = [
      "Inline, Internal, and External CSS Styling", "CSS Selectors (Class, ID, Grouping)", "Colors, Backgrounds, and Borders",
      "Font Properties and Text Formatting", "CSS Box Model (Margin, Border, Padding)", "Sizing Properties (Width, Height, Max-Width)",
      "CSS Positioning (Static, Relative, Absolute, Fixed, Sticky)", "Float and Clear Properties", "Styled Navigation Bar",
      "Pseudo-classes (:hover, :active, :focus)", "Pseudo-elements (::before, ::after)", "CSS Lists and Table Styling",
      "Styled Registration Form Layout", "CSS Flexbox Layouts", "CSS Grid Layouts", "Responsive Media Queries",
      "CSS Transitions and Transformations", "CSS Keyframe Animations", "Responsive Mobile Navigation Menu",
      "Personal Portfolio Layout", "College/Student Profile Dashboard", "Login Page Styling", "Product Card Component Layout",
      "Responsive Photo Gallery Layout", "Complete Homepage Wireframe", "CSS Inheritance and Specificity Rules",
      "Universal, Attribute, and Grouping Selectors", "Combinator Selectors (Descendant, Child, Sibling)", "CSS Custom Variables (--var)",
      "Background Images and Positioning", "Linear and Radial CSS Gradients", "Box Shadows and Text Shadows",
      "Border Radius and Custom Shapes", "Opacity and Transparency Techniques", "Overflow Properties (Hidden, Scroll, Auto)",
      "Z-Index and Stacking Context", "Display Properties (Block, Inline, Flex, Grid)", "Visibility and Hiding Elements",
      "Dropdown Navigation Menu", "Image Hover Effects and Zoom", "Pure CSS Tooltips", "CSS-Only Button Animations",
      "CSS Filters (Blur, Grayscale, Contrast)", "Object-Fit and Object-Position", "Responsive Image Grid Gallery",
      "Flexbox Card Layouts", "CSS Grid Dashboard Panel", "Two-Column Page Grid Layout", "Three-Column Flexbox Layout",
      "Sticky Page Header", "Fixed Sidebar Layout", "Responsive Footer Layout", "Login and Signup Switcher Form",
      "Responsive Contact Us Form", "College Portal Homepage Layout", "Restaurant Menu Layout", "E-Commerce Shopping Interface",
      "Travel Agency Homepage", "News/Blog Layout with CSS Grid", "Multi-Section Portfolio Page", "CSS Grid Template Areas",
      "Flexbox Alignment & Order Properties", "Responsive Grid with Media Queries", "Mobile-First Design Strategy",
      "CSS Smooth Transitions", "2D and 3D Transformations", "Custom Keyframe Spinner Animations", "CSS Loading Spinner",
      "Sliding Card Animation Interface", "CSS Pure Modal Popup", "Dark Mode Theme Switcher", "Responsive Typography",
      "CSS Functions: clamp(), min(), max()", "CSS Calc() Practical Calculations", "Complete Responsive Web Application Page"
    ];

    const jsTitles = [];
    // Populate 290 JS Titles
    const jsBase = [
      "Hello World Display", "Arithmetic Operations Calculator", "Largest of Three Numbers", "Even or Odd Checker",
      "Positive, Negative, or Zero Check", "Factorial Calculator", "Fibonacci Series Generator", "Prime Number Checker",
      "Palindrome Checker", "Reverse a Number", "Sum of Digits", "Array Max and Min Finder", "Array Sorting Algorithm",
      "Array Sum and Average", "Function Expressions", "Arrow Functions", "String Manipulation Methods",
      "Array Methods (map, filter, reduce)", "Object Literals & Methods", "Date and Math Object Utilities",
      "Dynamic Text Changer", "Background Color Switcher", "Click Counter", "Show/Hide Element Toggle",
      "Image Switcher", "Digital Clock Application", "Digital Calculator", "Number Guessing Game",
      "Form Field Validator", "Full Form Validation (Name, Email, Phone)", "To-Do List Application",
      "Quiz Application System", "Counter Application", "Stopwatch with Lap Function", "Countdown Timer",
      "ES6 Let, Const, Template Literals", "Spread and Rest Operators", "JS Classes and Objects",
      "Inheritance in ES6", "Callbacks, Promises, Async/Await", "Fetch API Integration", "Dynamic API Data Renderer",
      "LocalStorage Data Persistence", "Interactive Login Form", "Full Web Application Page", "Swap Two Numbers",
      "GCD of Two Numbers", "LCM of Two Numbers", "Armstrong Number Checker", "Perfect Number Checker",
      "Multiplication Table Generator", "Power Calculator", "Digit Counter", "Second Largest Array Item",
      "Remove Array Duplicates", "Merge Two Arrays", "Frequency of Array Elements", "Common Elements in Arrays",
      "Reverse a String", "String Palindrome Check", "Count Vowels and Consonants", "Word Counter",
      "Character Frequency Counter", "Regular Expression Basics", "Email Regex Validator",
      "Dynamic DOM Node Insertion", "Dynamic DOM Node Removal", "Dynamic CSS Style Modification",
      "Bulk Element Style Modifications", "getElementById vs querySelector", "querySelector & QuerySelectorAll",
      "Dynamic CSS Class Manipulation", "Dynamic HTML Table Generator", "Add/Delete Table Rows", "Table Filter Search",
      "Textarea Live Character Counter", "Password Show/Hide Toggle", "Dynamic Select Dropdown", "Dependent Dropdown",
      "Image Carousel / Slideshow", "Mouse Events Listener", "Keyboard Events Listener", "Form Events (Focus, Blur)",
      "Double Click Event Actions", "Event Bubbling & Capturing", "Event Delegation Pattern", "Keyboard Movement Control",
      "Drag and Drop Interface", "Student Registration System", "Login Form Validation", "Password Strength Meter",
      "Confirm Password Matcher", "Feedback Form Handler", "College Admission Form", "Dynamic Inline Errors",
      "Window Object Explorer", "Navigator Object Info", "Location Object Redirects", "History Navigation Buttons",
      "LocalStorage CRUD", "SessionStorage Temp Storage", "Shopping Cart with LocalStorage", "Dark Theme Toggle LocalStorage",
      "Simple Expense Tracker", "Student Marks Grade Calculator", "Shopping Cart Logic", "Notes App with LocalStorage",
      "Random Password Generator", "BMI Calculator", "Currency Converter API", "Interactive Portfolio Web Project"
    ];

    for (let i = 0; i < 290; i++) {
      const title = jsBase[i % jsBase.length] + ` (Variation #${i + 1})`;
      jsTitles.push(title);
    }

    const nodeTitles = [];
    const nodeBase = [
      "Client-Server Architecture", "HTTP Server creation", "Request-Response Cycle", "Built-in Modules Overview",
      "File System (fs) CRUD", "Path Module Utilities", "Custom Modules Export/Import", "NPM Package Management",
      "Callbacks, Promises, Async/Await", "Error Handling Middlewares", "Express.js Core Setup", "GET & POST Route Handlers",
      "Serving Static Files", "JSON Response Formatting", "Modular Express Architecture", "Express Routing Setup",
      "Route & Query Parameters", "Express Router Instance", "404 Route Handler", "User/Product Routes",
      "Custom Middleware Functions", "Request Logging Middleware", "Request Input Validation", "Authentication Middleware",
      "Error Middleware Chain", "Middleware Execution Order", "Cookie Parsing & Creation", "Cookie Deletion Handler",
      "Express Session Setup", "Session Login/Logout Logic", "Protected Session Routes", "Database Connectivity Setup",
      "Table/Collection Schema Creation", "Database Insert Operations", "Database Read Operations", "Database Update Operations",
      "Database Delete Operations", "Student Management CRUD API", "User Management CRUD API", "Product Management CRUD API",
      "CRUD with Database Sync", "Input Sanitization for CRUD", "User Registration System", "User Authentication Route",
      "Password Hashing with Bcrypt", "Password Verification Logic", "JWT Token Generation & Auth", "Protected JWT Routes",
      "Role-Based Access Control (RBAC)", "Admin vs User Authorization", "Restricted Admin Routes", "Authorization Middleware",
      "RESTful API Design", "Student REST API Complete"
    ];

    for (let i = 0; i < 54; i++) {
      nodeTitles.push(nodeBase[i % nodeBase.length] + ` - Module #${i + 1}`);
    }

    // Populate Master Data Array
    htmlTitles.forEach((t, i) => experimentsData.html.push({ id: `html-${i+1}`, title: t, code: generateHTMLCode(t) }));
    cssTitles.forEach((t, i) => experimentsData.css.push({ id: `css-${i+1}`, title: t, code: generateCSSCode(t) }));
    jsTitles.forEach((t, i) => experimentsData.js.push({ id: `js-${i+1}`, title: t, code: generateJSCode(t) }));
    nodeTitles.forEach((t, i) => experimentsData.node.push({ id: `node-${i+1}`, title: t, code: generateNodeCode(t) }));

    let currentCategory = 'html';
    let currentExperimentIndex = 0;

    function renderList() {
      const container = document.getElementById('expList');
      container.innerHTML = '';
      const list = experimentsData[currentCategory];

      list.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = `exp-item ${index === currentExperimentIndex ? 'active' : ''}`;
        el.onclick = () => loadExperiment(index);
        el.innerHTML = `<span class="exp-num">#${index + 1}</span> <span>${item.title}</span>`;
        container.appendChild(el);
      });
    }

    function switchCategory(cat) {
      currentCategory = cat;
      currentExperimentIndex = 0;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-cat') === cat);
      });
      document.getElementById('searchInput').value = '';
      renderList();
      if (experimentsData[cat].length > 0) {
        loadExperiment(0);
      }
    }

    function loadExperiment(index) {
      currentExperimentIndex = index;
      const exp = experimentsData[currentCategory][index];
      if (!exp) return;

      document.getElementById('currentTitle').innerText = exp.title;
      document.getElementById('codeEditor').value = exp.code;

      const iframe = document.getElementById('previewFrame');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

      iframeDoc.open();
      if (currentCategory === 'node') {
        iframeDoc.write(`<html><body style="background:#0f172a;color:#22c55e;font-family:monospace;padding:20px;">
            <h3>[Node.js Runtime Simulator]</h3>
            <p>File Executed: <strong>${exp.id}.js</strong></p>
            <hr style="border-color:#22c55e;margin:10px 0;">
            <pre style="white-space:pre-wrap;word-break:break-all;">${exp.code}</pre>
        </body></html>`);
      } else {
        iframeDoc.write(exp.code);
      }
      iframeDoc.close();

      renderList();
    }

    function setViewMode(mode) {
      const editor = document.getElementById('editorPane');
      const preview = document.getElementById('previewPane');

      document.getElementById('btnSplit').classList.toggle('active', mode === 'split');
      document.getElementById('btnCode').classList.toggle('active', mode === 'code');
      document.getElementById('btnPreview').classList.toggle('active', mode === 'preview');

      if (mode === 'split') {
        editor.style.display = 'flex';
        preview.style.display = 'flex';
      } else if (mode === 'code') {
        editor.style.display = 'flex';
        preview.style.display = 'none';
      } else if (mode === 'preview') {
        editor.style.display = 'none';
        preview.style.display = 'flex';
      }
    }

    function filterExperiments() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('expList');
      const list = experimentsData[currentCategory];

      container.innerHTML = '';
      list.forEach((item, index) => {
        if (item.title.toLowerCase().includes(q)) {
          const el = document.createElement('div');
          el.className = `exp-item ${index === currentExperimentIndex ? 'active' : ''}`;
          el.onclick = () => loadExperiment(index);
          el.innerHTML = `<span class="exp-num">#${index + 1}</span> <span>${item.title}</span>`;
          container.appendChild(el);
        }
      });
    }

    // Initialize Page
    switchCategory('html');
  </script>
</body>
</html>
