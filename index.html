<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="HTML, CSS and JavaScript Practical Programs">
<title>HTML CSS JavaScript Practical Lab</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1220;--panel:#111c2f;--panel2:#17243a;--text:#f8fafc;
  --muted:#9fb0c5;--border:#2b3a52;--html:#f97316;--css:#38bdf8;--js:#facc15;
  --accent:#8b5cf6;
}
body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:35px 20px;text-align:center;background:linear-gradient(135deg,#172554,#4c1d95);border-bottom:1px solid var(--border)}
header h1{font-size:clamp(1.8rem,5vw,3.2rem);margin-bottom:8px}
header p{color:#dbeafe;font-size:1.05rem}
.container{width:min(1250px,94%);margin:25px auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center}
.stat b{display:block;font-size:2rem}
.stat span{color:var(--muted)}
.controls{position:sticky;top:0;z-index:10;background:rgba(11,18,32,.94);backdrop-filter:blur(12px);padding:12px 0}
.search{width:100%;padding:14px 16px;background:var(--panel);color:white;border:1px solid var(--border);border-radius:10px;font-size:16px;outline:none}
.tabs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tab{flex:1;min-width:130px;padding:12px;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:9px;cursor:pointer;font-weight:700}
.tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.section{margin-top:25px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title h2{font-size:1.4rem}
.badge{padding:5px 10px;border-radius:999px;font-size:.8rem;background:var(--panel2);color:var(--muted)}
.programs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:17px;transition:.2s;cursor:pointer}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card-number{font-size:.78rem;color:var(--muted);margin-bottom:7px}
.card h3{font-size:1rem;line-height:1.45}
.card button{margin-top:12px;background:var(--accent);color:white;border:0;border-radius:7px;padding:8px 12px;cursor:pointer;font-weight:700}
.empty{padding:35px;text-align:center;color:var(--muted);background:var(--panel);border-radius:12px}
footer{margin-top:40px;padding:30px;text-align:center;color:var(--muted);border-top:1px solid var(--border)}

/* Demo modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal.show{display:flex}
.modal-box{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;color:#111827;border-radius:15px}
.modal-head{padding:18px 22px;background:#111827;color:white;display:flex;justify-content:space-between;gap:15px;align-items:center}
.close{background:#ef4444;color:white;border:0;border-radius:7px;padding:8px 12px;cursor:pointer}
.modal-body{padding:25px}
.demo{border:1px solid #d1d5db;border-radius:12px;padding:20px;margin-top:15px;background:#f8fafc}
.demo input,.demo select,.demo textarea{padding:10px;border:1px solid #cbd5e1;border-radius:7px;margin:5px 0;max-width:100%}
.demo button{padding:9px 13px;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer;margin:4px}
.result{margin-top:12px;padding:10px;background:#e2e8f0;border-radius:7px;min-height:20px}
.demo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.demo-box{padding:20px;border-radius:10px;background:#dbeafe;border:2px solid #2563eb}
pre{background:#0f172a;color:#93c5fd;padding:15px;border-radius:9px;overflow:auto}
@media(max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .demo-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header>
  <h1>HTML • CSS • JavaScript Practical Lab</h1>
  <p>All programs in one GitHub-ready HTML file</p>
</header>

<div class="container">
  <div class="stats">
    <div class="stat"><b>15</b><span>HTML Programs</span></div>
    <div class="stat"><b>75</b><span>CSS Programs</span></div>
    <div class="stat"><b>67</b><span>JavaScript Programs</span></div>
    <div class="stat"><b>157</b><span>Total</span></div>
  </div>

  <div class="controls">
    <input id="search" class="search" placeholder="Search any program..." oninput="render()">
    <div class="tabs">
      <button class="tab active" data-cat="all" onclick="setCategory('all')">All Programs</button>
      <button class="tab" data-cat="html" onclick="setCategory('html')">HTML</button>
      <button class="tab" data-cat="css" onclick="setCategory('css')">CSS</button>
      <button class="tab" data-cat="js" onclick="setCategory('js')">JavaScript</button>
    </div>
  </div>

  <div id="content"></div>
</div>

<footer>
  <p><strong>HTML, CSS & JavaScript Practical Assignment</strong></p>
  <p>Student: Shaik Abdulkalam | Register No: 250200116 | SCDS</p>
</footer>

<div class="modal" id="modal" onclick="closeOutside(event)">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">Program</h2>
      <button class="close" onclick="closeModal()">Close</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const programs = {
  html: [
  "Basic HTML Page Structure",
  "Text Formatting Tags",
  "Ordered, Unordered & Description Lists",
  "HTML Tables (Timetable Example)",
  "HTML Registration Form",
  "Images and Multimedia (Audio/Video)",
  "Links and Navigation Bar",
  "Semantic HTML5 Page Layout",
  "iframe and Embedded Content",
  "HTML Entities and Special Characters",
  "Meta Tags and SEO Basics",
  "HTML5 Canvas Basics",
  "Advanced Forms (fieldset, datalist, output)",
  "Accessibility Basics (ARIA & alt text)",
  "My Portfolio"
],
  css: [
  "Universal & Element Selectors",
  "Class & ID Selectors",
  "Grouping & Combinator Selectors",
  "Attribute Selectors",
  "Pseudo-class Selectors",
  "Pseudo-element Selectors",
  "Box Model Visualizer",
  "Margin Collapsing",
  "Border Styles",
  "Border-radius Shapes",
  "Box Shadow",
  "Background Linear Gradients",
  "Background Radial Gradients",
  "Background Images & Positioning",
  "Multiple Backgrounds",
  "Text Color & Background-clip Text",
  "Typography: Font-family & Fallback Stacks",
  "Typography: Font-size Units (px, em, rem, %)",
  "Text-align & Text-decoration",
  "Text-transform & Letter-spacing",
  "Line-height & Word-spacing",
  "Text Shadow",
  "Using Web Fonts (Google Fonts)",
  "List-style Customization",
  "Table Styling (Borders & Striping)",
  "Float Layout",
  "Clearfix Technique",
  "Display Property (block, inline, inline-block, none)",
  "Visibility vs Display",
  "Position: Static & Relative",
  "Position: Absolute",
  "Position: Fixed",
  "Position: Sticky",
  "Z-index & Stacking Context",
  "Overflow Property",
  "Flexbox: Container Basics (direction & wrap)",
  "Flexbox: justify-content",
  "Flexbox: align-items & align-content",
  "Flexbox: flex-grow, flex-shrink, flex-basis",
  "Flexbox: order Property",
  "Grid: Template Columns & Rows",
  "Grid: Gap Property",
  "Grid: Named Template Areas",
  "Grid: Responsive auto-fit/auto-fill",
  "Grid: justify-items & align-items",
  "CSS Custom Properties (Variables)",
  "The calc() Function",
  "min(), max() and clamp() Functions",
  "Practical Project: Responsive Photo Grid Card Layout",
  "Grid: Implicit vs Explicit Tracks",
  "Transitions Basics",
  "Transition Timing Functions",
  "Transform: translate",
  "Transform: rotate",
  "Transform: scale",
  "Transform: skew",
  "3D Transforms (perspective & rotateY)",
  "Keyframe Animation: Loading Spinner",
  "Keyframe Animation: Fade In/Out",
  "Keyframe Animation: Sliding",
  "Media Queries: Responsive Breakpoints",
  "Mobile-first Responsive Design",
  "Aspect-ratio Property",
  "Object-fit for Images",
  "CSS Filters (blur, brightness, grayscale)",
  "Backdrop-filter (Glassmorphism)",
  "Mix-blend-mode",
  "Clip-path Shapes",
  "Basic CSS Shapes",
  "Cursor Styles",
  "User-select & Pointer-events",
  "Custom Scrollbar Styling",
  "Scroll-snap",
  "CSS Counters",
  "Print Stylesheet (@media print)"
],
  js: [
  "Digital Calculator",
  "Digital Clock",
  "Stopwatch",
  "Countdown Timer",
  "To-Do List",
  "Random Quote Generator",
  "Number Guessing Game",
  "Rock Paper Scissors Game",
  "BMI Calculator",
  "Temperature Converter",
  "Length Unit Converter",
  "Random Color Generator",
  "Random Password Generator",
  "Tip Calculator",
  "Simple Image/Color Slider (Carousel)",
  "Word & Character Counter",
  "Age Calculator",
  "Dice Roller",
  "DOM Manipulation Basics",
  "DOM Traversal (Parent, Child, Sibling)",
  "Creating & Removing Elements Dynamically",
  "classList: add, remove, toggle, contains",
  "Dynamic Table Generator from Array",
  "Event Handling Basics (click, mouseover, keydown, dblclick)",
  "Event Bubbling and Capturing",
  "Event Delegation",
  "Keyboard Events (keyup, keydown, keypress)",
  "Form Events (submit, change, input, focus, blur)",
  "Drag and Drop",
  "Basic Form Validation",
  "Regex-based Email & Phone Validation",
  "Real-time Input Validation with Live Feedback",
  "The Window Object",
  "The Navigator Object",
  "The Location Object",
  "The History Object",
  "The Screen Object",
  "The Geolocation API",
  "Timers: setTimeout vs setInterval",
  "localStorage Basics",
  "sessionStorage Basics",
  "Cookies with JavaScript",
  "Storing Objects (JSON) in localStorage",
  "Array.map()",
  "Array.filter()",
  "Array.reduce()",
  "Array.forEach() and .sort()",
  "Array.find(), findIndex() and includes()",
  "String Manipulation Methods",
  "Object.keys(), values() and entries()",
  "Object.assign() and Merging Objects",
  "Arrow Functions & Template Literals",
  "Destructuring (Array & Object)",
  "Spread and Rest Operators",
  "let/const and Block Scope",
  "Default Function Parameters",
  "Functions and Parameters",
  "Closures Demonstration",
  "Higher-Order Functions",
  "Callback Functions",
  "Promises Basics",
  "Async/Await Basics",
  "Fetch API - Get Data from a Public API",
  "Promise Chaining",
  "Try/Catch Error Handling",
  "JSON.stringify() and JSON.parse()",
  "Regular Expressions Basics"
]
};

let category = "all";

function setCategory(cat) {
  category = cat;
  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("active", b.dataset.cat === cat)
  );
  render();
}

function render() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const content = document.getElementById("content");
  const cats = category === "all" ? ["html","css","js"] : [category];

  let output = "";
  cats.forEach(cat => {
    const filtered = programs[cat].map((title,i)=>({title,i}))
      .filter(x => x.title.toLowerCase().includes(q));

    if (!filtered.length) return;

    const label = cat === "html" ? "HTML Programs" :
                  cat === "css" ? "CSS Programs" : "JavaScript Programs";

    output += `<section class="section">
      <div class="section-title">
        <h2>${label}</h2>
        <span class="badge">${filtered.length} shown</span>
      </div>
      <div class="programs">`;

    filtered.forEach(x => {
      output += `<article class="card" onclick="openProgram('${cat}',${x.i})">
        <div class="card-number">Program ${x.i+1}</div>
        <h3>${escapeHTML(x.title)}</h3>
        <button onclick="event.stopPropagation();openProgram('${cat}',${x.i})">Open Program</button>
      </article>`;
    });

    output += `</div></section>`;
  });

  content.innerHTML = output || `<div class="empty">No program found.</div>`;
}

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[c]);
}

function openProgram(cat, index) {
  const title = programs[cat][index];
  document.getElementById("modalTitle").textContent = title;

  let demo = "";
  if (cat === "html") demo = htmlDemo(title);
  if (cat === "css") demo = cssDemo(title);
  if (cat === "js") demo = jsDemo(title);

  document.getElementById("modalBody").innerHTML =
    `<p><strong>Category:</strong> ${cat.toUpperCase()}</p>
     <p>This is a standalone demonstration of <strong>${escapeHTML(title)}</strong>.</p>
     <div class="demo">${demo}</div>`;

  document.getElementById("modal").classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

function closeOutside(e) {
  if (e.target.id === "modal") closeModal();
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

function htmlDemo(title) {
  const t = title.toLowerCase();

  if (t.includes("table") || t.includes("timetable"))
    return `<table style="width:100%;border-collapse:collapse">
      <tr><th style="border:1px solid #94a3b8;padding:8px">Day</th><th style="border:1px solid #94a3b8;padding:8px">Subject</th></tr>
      <tr><td style="border:1px solid #94a3b8;padding:8px">Monday</td><td style="border:1px solid #94a3b8;padding:8px">HTML</td></tr>
      <tr><td style="border:1px solid #94a3b8;padding:8px">Tuesday</td><td style="border:1px solid #94a3b8;padding:8px">CSS</td></tr>
    </table>`;

  if (t.includes("form"))
    return `<form onsubmit="event.preventDefault();this.querySelector('.result').textContent='Form submitted successfully!'">
      <input placeholder="Student Name" required><br>
      <input type="email" placeholder="Email" required><br>
      <input type="password" placeholder="Password" required><br>
      <button type="submit">Submit</button><div class="result"></div>
    </form>`;

  if (t.includes("image") || t.includes("multimedia"))
    return `<img src="https://picsum.photos/700/250" alt="Demo image" style="max-width:100%;border-radius:10px">`;

  if (t.includes("list"))
    return `<h3>HTML Lists</h3><ol><li>HTML</li><li>CSS</li><li>JavaScript</li></ol>
            <ul><li>Frontend</li><li>Backend</li><li>Database</li></ul>`;

  return `<h2>Hello HTML</h2><p>This is a working HTML demonstration.</p>
          <button onclick="this.nextElementSibling.textContent='Button clicked!'">Click Me</button>
          <div class="result"></div>`;
}

function cssDemo(title) {
  const t = title.toLowerCase();

  if (t.includes("gradient"))
    return `<div style="height:180px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#9333ea);display:grid;place-items:center;color:white;font-size:25px">Gradient Demo</div>`;

  if (t.includes("grid"))
    return `<div class="demo-grid"><div class="demo-box">1</div><div class="demo-box">2</div><div class="demo-box">3</div></div>`;

  if (t.includes("flex"))
    return `<div style="display:flex;justify-content:space-around;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="demo-box">Flex 1</div><div class="demo-box">Flex 2</div><div class="demo-box">Flex 3</div></div>`;

  if (t.includes("shadow"))
    return `<div style="padding:40px;text-align:center;background:white;border-radius:15px;box-shadow:12px 12px 30px #64748b">Box Shadow Demo</div>`;

  if (t.includes("animation") || t.includes("spinner"))
    return `<div style="width:70px;height:70px;border:8px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite"></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;

  return `<div style="padding:30px;border:3px solid #2563eb;border-radius:15px;background:#dbeafe;transition:.3s"
    onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='scale(1)'">
    <h2>CSS Concept</h2><p>Hover this box to see the CSS effect.</p></div>`;
}

function jsDemo(title) {
  const t = title.toLowerCase();

  if (t.includes("calculator"))
    return `<input id="a" type="number" value="10"> <input id="b" type="number" value="5">
      <button onclick="document.getElementById('calcResult').textContent=Number(a.value)+Number(b.value)">Add</button>
      <div class="result" id="calcResult"></div>`;

  if (t.includes("clock"))
    return `<div id="clock" style="font-size:2rem;font-weight:bold"></div>
      <script>(function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();setTimeout(tick,1000)})();<\/script>`;

  if (t.includes("stopwatch"))
    return `<div id="sw" style="font-size:2rem">0</div>
      <button onclick="window.swTimer=setInterval(()=>sw.textContent=Number(sw.textContent)+1,1000)">Start</button>
      <button onclick="clearInterval(window.swTimer)">Stop</button>
      <button onclick="sw.textContent=0">Reset</button>`;

  if (t.includes("countdown"))
    return `<input id="seconds" type="number" value="10"><button onclick="startCountdown()">Start</button>
      <div class="result" id="count"></div>
      <script>function startCountdown(){let n=+seconds.value;clearInterval(window.cd);count.textContent=n;window.cd=setInterval(()=>{n--;count.textContent=n;if(n<=0)clearInterval(window.cd)},1000)}<\/script>`;

  if (t.includes("to-do") || t.includes("todo"))
    return `<input id="task" placeholder="Enter task"><button onclick="addTask()">Add</button><ul id="tasks"></ul>
      <script>function addTask(){if(!task.value.trim())return;const li=document.createElement('li');li.textContent=task.value+' ';const b=document.createElement('button');b.textContent='Delete';b.onclick=()=>li.remove();li.appendChild(b);tasks.appendChild(li);task.value=''}<\/script>`;

  if (t.includes("form") || t.includes("validation"))
    return `<form onsubmit="event.preventDefault();document.getElementById('valid').textContent='Valid submission!'">
      <input required placeholder="Name"><input required type="email" placeholder="Email">
      <button>Validate</button></form><div class="result" id="valid"></div>`;

  if (t.includes("localstorage"))
    return `<input id="store" placeholder="Value"><button onclick="localStorage.setItem('lab',store.value)">Save</button>
      <button onclick="document.getElementById('stored').textContent=localStorage.getItem('lab')||'Nothing saved'">Load</button>
      <div class="result" id="stored"></div>`;

  if (t.includes("api") || t.includes("fetch"))
    return `<button onclick="fetch('https://jsonplaceholder.typicode.com/todos/1').then(r=>r.json()).then(x=>document.getElementById('apiout').textContent=JSON.stringify(x,null,2)).catch(()=>apiout.textContent='API unavailable')">Fetch API</button>
      <pre id="apiout"></pre>`;

  return `<button onclick="document.getElementById('jsout').textContent='JavaScript executed successfully!'">Run JavaScript</button>
          <div class="result" id="jsout"></div>`;
}

render();
</script>
</body>
</html>
