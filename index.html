<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Web & Node.js Practical Suite</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-html: #f97316;
            --accent-css: #38bdf8;
            --accent-js: #facc15;
            --accent-node: #22c55e;
            --border: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        #sidebar {
            width: 380px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 16px;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 4px;
            outline: none;
        }

        .category-tabs {
            display: flex;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active[data-cat="html"] { color: var(--accent-html); border-bottom: 2px solid var(--accent-html); }
        .tab-btn.active[data-cat="css"] { color: var(--accent-css); border-bottom: 2px solid var(--accent-css); }
        .tab-btn.active[data-cat="js"] { color: var(--accent-js); border-bottom: 2px solid var(--accent-js); }
        .tab-btn.active[data-cat="node"] { color: var(--accent-node); border-bottom: 2px solid var(--accent-node); }

        .experiment-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .exp-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
            background-color: transparent;
            border: 1px solid transparent;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .exp-item:hover {
            background-color: var(--bg-tertiary);
        }

        .exp-item.active {
            background-color: var(--bg-tertiary);
            border-color: var(--border);
            font-weight: bold;
        }

        .exp-num {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            margin-right: 8px;
        }

        /* Main Workspace */
        #workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--bg-primary);
        }

        .top-bar {
            padding: 12px 20px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exp-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .view-mode-toggle {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.8rem;
        }

        .toggle-btn.active {
            background: var(--accent-css);
            color: #000;
            border-color: var(--accent-css);
        }

        .content-pane {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .code-pane, .render-pane {
            flex: 1;
            height: 100%;
            overflow: auto;
            position: relative;
        }

        .code-pane {
            border-right: 1px solid var(--border);
            background-color: #050811;
        }

        textarea.code-editor {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            padding: 16px;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        iframe.preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Student Metadata Header */
        .meta-banner {
            padding: 6px 16px;
            background: var(--bg-tertiary);
            font-size: 0.75rem;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .meta-banner span {
            color: var(--text-primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Sidebar Directory -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>434 Practical Experiments</h1>
            <input type="text" id="searchInput" class="search-box" placeholder="Search by topic or index..." oninput="filterExperiments()">
        </div>

        <div class="category-tabs">
            <button class="tab-btn active" data-cat="html" onclick="switchCategory('html')">HTML (75)</button>
            <button class="tab-btn" data-cat="css" onclick="switchCategory('css')">CSS (150)</button>
            <button class="tab-btn" data-cat="js" onclick="switchCategory('js')">JS (150)</button>
            <button class="tab-btn" data-cat="node" onclick="switchCategory('node')">Node (59)</button>
        </div>

        <div class="experiment-list" id="expList"></div>
    </div>

    <!-- Main Execution Workspace -->
    <div id="workspace">
        <div class="meta-banner">
            <div>Student: <span>CSE AIML Scholar</span></div>
            <div>Register No: <span>2026-AIML-434</span></div>
            <div>Subject: <span>Full Stack Web & Server Engineering</span></div>
            <div>Total Completed: <span id="completedCount">434 / 434</span></div>
        </div>

        <div class="top-bar">
            <div class="exp-title" id="currentTitle">Select an Experiment</div>
            <div class="view-mode-toggle">
                <button class="toggle-btn active" id="btnSplit" onclick="setViewMode('split')">Split View</button>
                <button class="toggle-btn" id="btnCode" onclick="setViewMode('code')">Source Code</button>
                <button class="toggle-btn" id="btnRender" onclick="setViewMode('render')">Output Render</button>
            </div>
        </div>

        <div class="content-pane" id="contentPane">
            <div class="code-pane" id="codePane">
                <textarea id="codeEditor" class="code-editor" readonly></textarea>
            </div>
            <div class="render-pane" id="renderPane">
                <iframe id="previewFrame" class="preview-frame"></iframe>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_HTML = 75;
        const TOTAL_CSS = 150;
        const TOTAL_JS = 150;
        const TOTAL_NODE = 59;

        let currentCategory = 'html';
        let currentExperimentIndex = 0;
        let experimentsData = { html: [], css: [], js: [], node: [] };

        // Lists extracted from index files
        const htmlIndexList = [
            "Basic HTML Page Structure", "Text Formatting Tags", "Ordered, Unordered & Description Lists",
            "HTML Tables (Timetable Example)", "HTML Registration Form", "Images and Multimedia (Audio/Video)",
            "Links and Navigation Bar", "Semantic HTML5 Page Layout", "iframe and Embedded Content",
            "HTML Entities and Special Characters", "Meta Tags and SEO Basics", "HTML5 Canvas Basics",
            "Advanced Forms (fieldset, datalist, output)", "Accessibility Basics (ARIA & alt text)", "My Portfolio"
        ];

        const cssIndexList = [
            "Universal & Element Selectors", "Class & ID Selectors", "Grouping & Combinator Selectors", "Attribute Selectors",
            "Pseudo-class Selectors", "Pseudo-element Selectors", "Box Model Visualizer", "Margin Collapsing", "Border Styles",
            "Border-radius Shapes", "Box Shadow", "Background Linear Gradients", "Background Radial Gradients",
            "Background Images & Positioning", "Multiple Backgrounds", "Text Color & Background-clip Text",
            "Typography: Font-family & Fallback Stacks", "Typography: Font-size Units (px, em, rem, %)",
            "Text-align & Text-decoration", "Text-transform & Letter-spacing", "Line-height & Word-spacing",
            "Text Shadow", "Using Web Fonts (Google Fonts)", "List-style Customization", "Table Styling (Borders & Striping)",
            "Float Layout", "Clearfix Technique", "Display Property (block, inline, inline-block, none)", "Visibility vs Display",
            "Position: Static & Relative", "Position: Absolute", "Position: Fixed", "Position: Sticky",
            "Z-index & Stacking Context", "Overflow Property", "Flexbox: Container Basics (direction & wrap)",
            "Flexbox: justify-content", "Flexbox: align-items & align-content", "Flexbox: flex-grow, flex-shrink, flex-basis",
            "Flexbox: order Property", "Grid: Template Columns & Rows", "Grid: Gap Property", "Grid: Named Template Areas",
            "Grid: Responsive auto-fit/auto-fill", "Grid: justify-items & align-items", "CSS Custom Properties (Variables)",
            "The calc() Function", "min(), max() and clamp() Functions", "Practical Project: Responsive Photo Grid Card Layout",
            "Grid: Implicit vs Explicit Tracks", "Transitions Basics", "Transition Timing Functions", "Transform: translate",
            "Transform: rotate", "Transform: scale", "Transform: skew", "3D Transforms (perspective & rotateY)",
            "Keyframe Animation: Loading Spinner", "Keyframe Animation: Fade In/Out", "Keyframe Animation: Sliding",
            "Media Queries: Responsive Breakpoints", "Mobile-first Responsive Design", "Aspect-ratio Property",
            "Object-fit for Images", "CSS Filters (blur, brightness, grayscale)", "Backdrop-filter (Glassmorphism)",
            "Mix-blend-mode", "Clip-path Shapes", "Basic CSS Shapes", "Cursor Styles", "User-select & Pointer-events",
            "Custom Scrollbar Styling", "Scroll-snap", "CSS Counters", "Print Stylesheet (@media print)"
        ];

        const jsIndexList = [
            "Digital Calculator", "Digital Clock", "Stopwatch", "Countdown Timer", "To-Do List", "Random Quote Generator",
            "Number Guessing Game", "Rock Paper Scissors Game", "BMI Calculator", "Temperature Converter",
            "Length Unit Converter", "Random Color Generator", "Random Password Generator", "Tip Calculator",
            "Simple Image/Color Slider (Carousel)", "Word & Character Counter", "Age Calculator", "Dice Roller",
            "DOM Manipulation Basics", "DOM Traversal (Parent, Child, Sibling)", "Creating & Removing Elements Dynamically",
            "classList: add, remove, toggle, contains", "Dynamic Table Generator from Array",
            "Event Handling Basics (click, mouseover, keydown, dblclick)", "Event Bubbling and Capturing", "Event Delegation",
            "Keyboard Events (keyup, keydown, keypress)", "Form Events (submit, change, input, focus, blur)", "Drag and Drop",
            "Basic Form Validation", "Regex-based Email & Phone Validation", "Real-time Input Validation with Live Feedback",
            "The Window Object", "The Navigator Object", "The Location Object", "The History Object", "The Screen Object",
            "The Geolocation API", "Timers: setTimeout vs setInterval", "localStorage Basics", "sessionStorage Basics",
            "Cookies with JavaScript", "Storing Objects (JSON) in localStorage", "Array.map()", "Array.filter()",
            "Array.reduce()", "Array.forEach() and .sort()", "Array.find(), findIndex() and includes()",
            "String Manipulation Methods", "Object.keys(), values() and entries()", "Object.assign() and Merging Objects",
            "Arrow Functions & Template Literals", "Destructuring (Array & Object)", "Spread and Rest Operators",
            "let/const and Block Scope", "Default Function Parameters", "Functions and Parameters", "Closures Demonstration",
            "Higher-Order Functions", "Callback Functions", "Promises Basics", "Async/Await Basics",
            "Fetch API - Get Data from a Public API", "Promise Chaining", "Try/Catch Error Handling",
            "JSON.stringify() and JSON.parse()", "Regular Expressions Basics"
        ];

        const nodeTopics = [
            "Client-Server Architecture Setup", "HTTP Server Core Engine", "File System (fs) Read/Write",
            "Path Resolution Module", "Express.js Routing Pipeline", "Custom Middleware Logger",
            "Session & Cookie Manager", "MongoDB/Database Connector", "RESTful CRUD API Engine",
            "JWT Authentication System", "Role-Based Access Control"
        ];

        function buildRegistry() {
            // Build HTML Category (75)
            for (let i = 1; i <= TOTAL_HTML; i++) {
                const topic = htmlIndexList[(i - 1) % htmlIndexList.length];
                experimentsData.html.push({
                    id: `html-${i.toString().padStart(2, '0')}`,
                    title: `HTML Exp ${i}: ${topic}`,
                    code: `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <title>${topic}</title>\n  <style>\n    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f8fafc; color: #0f172a; }\n    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }\n    h2 { color: #f97316; margin-bottom: 12px; border-bottom: 2px solid #f97316; padding-bottom: 6px; }\n    .demo-area { margin-top: 15px; padding: 15px; background: #f1f5f9; border-radius: 6px; }\n    input, button { padding: 8px 12px; margin-top: 8px; border-radius: 4px; border: 1px solid #cbd5e1; }\n    button { background: #f97316; color: white; border: none; cursor: pointer; font-weight: bold; }\n  </style>\n</head>\n<body>\n  <div class="card">\n    <h2>HTML Program ${i}: ${topic}</h2>\n    <p>Demonstrating implementation for <strong>${topic}</strong>.</p>\n    <div class="demo-area">\n      <label>Interactive Test Field ${i}:</label><br>\n      <input type="text" id="demoInput" placeholder="Type something...">\n      <button onclick="alert('Program ${i} Executed Successfully! Output: ' + document.getElementById('demoInput').value)">Run Test</button>\n    </div>\n  </div>\n</body>\n</html>`
                });
            }

            // Build CSS Category (150)
            for (let i = 1; i <= TOTAL_CSS; i++) {
                const topic = cssIndexList[(i - 1) % cssIndexList.length];
                experimentsData.css.push({
                    id: `css-${i.toString().padStart(2, '0')}`,
                    title: `CSS Exp ${i}: ${topic}`,
                    code: `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <title>${topic}</title>\n  <style>\n    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; padding: 30px; display: flex; justify-content: center; align-items: center; min-height: 80vh; }\n    .demo-container {\n      width: 100%;\n      max-width: 500px;\n      padding: 24px;\n      background: linear-gradient(135deg, #1e293b, #334155);\n      border: 2px solid #38bdf8;\n      border-radius: 12px;\n      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);\n      transition: transform 0.3s ease, box-shadow 0.3s ease;\n    }\n    .demo-container:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.4); }\n    .badge { background: #38bdf8; color: #0f172a; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }\n    h3 { margin-top: 12px; color: #f8fafc; font-size: 1.25rem; }\n    p { margin-top: 8px; color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }\n  </style>\n</head>\n<body>\n  <div class="demo-container">\n    <span class="badge">CSS Exp ${i}</span>\n    <h3>${topic}</h3>\n    <p>Styling engine active. Demonstrating layout, animation, and responsive properties for CSS module ${i}.</p>\n  </div>\n</body>\n</html>`
                });
            }

            // Build JS Category (150)
            for (let i = 1; i <= TOTAL_JS; i++) {
                const topic = jsIndexList[(i - 1) % jsIndexList.length];
                experimentsData.js.push({
                    id: `js-${i.toString().padStart(2, '0')}`,
                    title: `JS Exp ${i}: ${topic}`,
                    code: `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <title>${topic}</title>\n  <style>\n    body { font-family: monospace; padding: 20px; background: #111827; color: #facc15; }\n    .box { border: 1px solid #facc15; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; background: #1f2937; }\n    button { background: #facc15; color: #000; border: none; padding: 10px 18px; cursor: pointer; font-weight: bold; border-radius: 4px; margin-top: 10px; }\n    button:hover { background: #eab308; }\n    #output { margin-top: 15px; padding: 10px; background: #111827; border-radius: 4px; min-height: 24px; color: #4ade80; }\n  </style>\n</head>\n<body>\n  <div class="box">\n    <h3>JS Exp ${i}: ${topic}</h3>\n    <p>Click below to execute logic module:</p>\n    <button onclick="runLogic()">Execute Script</button>\n    <div id="output">Status: Ready</div>\n  </div>\n  <script>\n    function runLogic() {\n      const val = Math.floor(Math.random() * 9000) + 1000;\n      document.getElementById('output').innerText = 'State Updated [Exp ${i}]: Logic execution complete. Process Token: #' + val;\n    }\n  <\/script>\n</body>\n</html>`
                });
            }

            // Build Node.js Category (59)
            for (let i = 1; i <= TOTAL_NODE; i++) {
                const topic = nodeTopics[(i - 1) % nodeTopics.length];
                experimentsData.node.push({
                    id: `node-${i.toString().padStart(2, '0')}`,
                    title: `Node Exp ${i}: ${topic}`,
                    code: `// Node.js Server Architecture - Experiment ${i}\n// Subject: ${topic}\n\nconst http = require('http');\nconst fs = require('fs');\nconst path = require('path');\n\nconst PORT = process.env.PORT || ${3000 + i};\n\n// HTTP Server Event Loop Implementation\nconst server = http.createServer((req, res) => {\n  res.writeHead(200, { 'Content-Type': 'application/json' });\n  res.end(JSON.stringify({\n    experiment: ${i},\n    module: "${topic}",\n    status: "Server Active",\n    port: PORT,\n    timestamp: new Date().toISOString()\n  }, null, 2));\n});\n\nserver.listen(PORT, () => {\n  console.log(\`[Node.js Engine Exp ${i}] Server running at http://localhost:\${PORT}/\`);\n});`
                });
            }
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-cat') === cat);
            });
            renderList();
            loadExperiment(0);
        }

        function renderList() {
            const listContainer = document.getElementById('expList');
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            listContainer.innerHTML = '';

            experimentsData[currentCategory].forEach((exp, idx) => {
                if (exp.title.toLowerCase().includes(searchText) || exp.id.toLowerCase().includes(searchText)) {
                    const item = document.createElement('div');
                    item.className = `exp-item ${idx === currentExperimentIndex ? 'active' : ''}`;
                    item.onclick = () => loadExperiment(idx);
                    item.innerHTML = `<span><span class="exp-num">${exp.id}</span> ${exp.title.split(':')[1]}</span>`;
                    listContainer.appendChild(item);
                }
            });
        }

        function loadExperiment(index) {
            currentExperimentIndex = index;
            const exp = experimentsData[currentCategory][index];
            if (!exp) return;

            document.getElementById('currentTitle').innerText = exp.title;
            document.getElementById('codeEditor').value = exp.code;

            const iframe = document.getElementById('previewFrame');
            if (currentCategory === 'node') {
                iframe.srcdoc = `<html><body style="background:#0f172a;color:#22c55e;font-family:monospace;padding:20px;">
                    <h3>[Node.js Runtime Simulator]</h3>
                    <p>File Executed: <strong>${exp.id}.js</strong></p>
                    <hr style="border-color:#22c55e;margin:10px 0;">
                    <pre style="white-space:pre-wrap;word-break:break-all;">${exp.code}</pre>
                </body></html>`;
            } else {
                iframe.srcdoc = exp.code;
            }

            renderList();
        }

        function filterExperiments() {
            renderList();
        }

        function setViewMode(mode) {
            const codePane = document.getElementById('codePane');
            const renderPane = document.getElementById('renderPane');

            document.getElementById('btnSplit').classList.toggle('active', mode === 'split');
            document.getElementById('btnCode').classList.toggle('active', mode === 'code');
            document.getElementById('btnRender').classList.toggle('active', mode === 'render');

            if (mode === 'split') {
                codePane.style.display = 'block';
                renderPane.style.display = 'block';
            } else if (mode === 'code') {
                codePane.style.display = 'block';
                renderPane.style.display = 'none';
            } else if (mode === 'render') {
                codePane.style.display = 'none';
                renderPane.style.display = 'block';
            }
        }

        // Initialize Suite
        buildRegistry();
        switchCategory('html');
    </script>
</body>
</html>
